version: "3.1"

rules:
- rule: Chào hỏi
  steps:
  - intent: greet
  - action: utter_greet

- rule: Tạm biệt
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Kích hoạt Form tìm kiếm sản phẩm
  condition:
  - active_loop: null
  steps:
  - intent: search_product
  - action: product_search_form
  - active_loop: product_search_form

- rule: Submit form khi đang chạy
  condition:
  - active_loop: product_search_form
  steps:
  - action: product_search_form
  - active_loop: null
  - action: action_submit_search_form
  - slot_was_set:
    - product_type: null
    - brand: null
    - price_range: null
    - feature: null

- rule: Trả lời về chính sách bảo hành
  steps:
  - intent: ask_warranty
  - action: utter_warranty

- rule: Trả lời về chính sách vận chuyển
  steps:
  - intent: ask_shipping
  - action: utter_shipping