version: "3.1"
rules:
- rule: Chào hỏi
  steps:
  - intent: greet
  - action: utter_greet
- rule: Tạm biệt
  steps:
  - intent: goodbye
  - action: utter_goodbye
- rule: Xử lý tìm kiếm sản phẩm
  steps:
  - intent: search_product
  - action: action_handle_search
- rule: Xử lý hỏi chi tiết sản phẩm
  steps:
  - intent: ask_product_details
  - action: action_product_details