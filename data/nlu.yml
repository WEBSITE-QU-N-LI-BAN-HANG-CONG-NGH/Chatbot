version: "3.1"
nlu:
- intent: greet
  examples: |
    - xin chào
    - chào bạn
    - hello
- intent: goodbye
  examples: |
    - tạm biệt
    - bye
- intent: thank
  examples: |
    - cảm ơn bạn
- intent: affirm
  examples: |
    - có
    - đúng
- intent: deny
  examples: |
    - không
    - bỏ qua

- intent: search_product
  examples: |
    - tôi muốn mua sắm
    - tư vấn cho tôi
    - tìm giúp tôi một sản phẩm
    - bạn có thể giới thiệu [laptop](product_type) cho tôi không
    - tôi muốn mua [điện thoại](product_type) mới
    - gợi ý cho tôi một [laptop](product_type) tốt
    - tìm [laptop](product_type) giá [dưới 15 triệu](price_range)
    - [laptop](product_type) [từ 15 đến 20 triệu](price_range)
    - tìm [laptop](product_type) của [Acer](brand)
    - có máy [Asus](brand) không
    - [điện thoại](product_type) [Samsung](brand) giá [dưới 15 triệu](price_range)

- intent: ask_product_details
  examples: |
    - thông tin chi tiết về [Acer Swift X14](product_name)
    - xem máy [Laptop Acer Nitro 5 Eagle](product_name)
    - tôi muốn mua [Sạc dự phòng Anker PowerCore III Elite](product_name)
    - [Laptop ASUS ROG Strix SCAR 17](product_name)
    - giá của [Laptop HP Spectre x360 14](product_name)

- intent: ask_order_status
  examples: |
    - kiểm tra đơn hàng [12345](order_id)
- intent: ask_warranty
  examples: |
    - chính sách bảo hành