version: "3.1"

stories:
- story: Người dùng tìm kiếm và xem chi tiết
  steps:
  - intent: search_product
    entities:
    - product_type: "laptop"
    - brand: "dell"
  - action: product_search_form
  - active_loop: product_search_form
  - slot_was_set:
    - product_type: "laptop"
    - brand: "dell"
  - active_loop: null
  - action: action_submit_search_form

  - intent: ask_product_details
    entities:
    - product_name: "Dell XPS 13" # Giả sử người dùng hỏi về 1 sp trong kết quả
  - action: action_product_details
  - intent: goodbye
  - action: utter_goodbye

- story: Người dùng kiểm tra đơn hàng
  steps:
  - intent: ask_order_status
    entities:
    - order_id: "123"
  - action: action_check_order_status
  - intent: thank
  - action: utter_thank