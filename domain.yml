version: "3.1"
intents:
  - greet
  - goodbye
  - search_product
  - ask_product_details
entities:
  - product_type
  - product_name
  - brand
  - price_range
slots:
  product_type: { type: text, mappings: [{type: from_entity, entity: product_type}] }
  brand: { type: text, mappings: [{type: from_entity, entity: brand}] }
  price_range: { type: text, mappings: [{type: from_entity, entity: price_range}] }
responses:
  utter_greet:
    - text: "Xin chào! Tôi là trợ lý Tech Shop AI. Tôi có thể giúp gì cho bạn?"
  utter_goodbye:
    - text: "Cảm ơn bạn. Hẹn gặp lại!"
  utter_ask_product_type:
    - text: "Bạn muốn tìm sản phẩm nào (ví dụ: laptop, điện thoại)?"
  utter_now_searching:
    - text: "Vui lòng đợi một chút để tôi tìm kiếm..."
actions:
  - action_handle_search
  - action_product_details